name: Deploy to production

# Manual deploys only: repo Actions tab → "Deploy to production" → Run workflow.
# Pushing to main does NOT trigger a deploy. To make deploys automatic,
# uncomment the push trigger below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            docker compose build
            docker compose up -d
            docker compose ps
